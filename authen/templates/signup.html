{% extends "main.html" %}
{% block content %}
    <h1>SIGNUP WITH YOUR DETAILS...</h1>
    <section class="signup">
        <form method="post">
        {% csrf_token %}
        <table border="2">
            <tr>
                <th>FIRSTNAME </th>
                <td><input type="text" name = 'fn' required></td>
            </tr>
            <tr>
                <th>LASTNAME </th>
                <td><input type="text" name = 'ln' required></td>
            </tr>
            <tr>
                <th>EMAIL </th>
                <td><input type="email" name="email" required></td>
            </tr>
            <tr>
                <th>USERNAME </th>
                <td><input type="text" name = 'un' required></td>
            </tr>
            <tr>
                <th>PASSWORD </th>
                <td><input type="password" name="pw" required></td>
            </tr>
            <tr>
                <td><button type="submit">SUBMIT</button></td>
            </tr>
        </table>
    </form>

    <p>Already have an account? SIGNIN <a href="{% url 'signin' %}">here.</a></p>

    </section>
{% endblock content %}
