{% extends 'main.html' %}

{% block content %}
<h1>Show Details of list..!</h1>
{% for i in data%}
<ul>
    <li>Movie : {{i.movie}}</li>
    <li>Show_Date : {{i.show_date}}</li>
    <li>Show_Time : {{i.show_timme}}</li>
    <li>Screen : {{i.screen}}</li>
</ul>
<a href="{% url 'update' i.id %}"><button>Update</button></a>
<a href="{% url 'delete' i.id %}"><button>Delete</button></a>
{% endfor%}



{% endblock content %}
